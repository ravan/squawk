<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Squawk">
  <!-- Transparent glyph: no badge. For README headers, docs and light or dark backgrounds. -->
  <g transform="translate(-14,-6) scale(1.2)">
<g transform="rotate(-9 58 72)">
    <!-- crest: one swept plume, so it never reads as fingers -->
    <path d="M68 56 C67 37 59 21 41 13 C34 10 29 17 34 24 C43 32 47 40 47 48 C39 37 28 30 17 27 C10 25 7 32 13 38 C24 45 31 53 35 62 Z"
          fill="#FF8A70"/>

    <!-- head -->
    <circle cx="56" cy="74" r="31" fill="#FF6B57"/>
    <ellipse cx="39" cy="87" rx="9" ry="6.5" fill="#E63F2C" opacity="0.5"/>

    <!-- open beak, mid-squawk -->
    <path d="M82 76 C85 70 90 67 97 64 C101 71 100 79 96 85 C90 84 85 81 82 78 Z" fill="#B5432A"/>
    <path d="M80 66 L102 60 Q105 59.5 104 63 L98 72 Q90 70 79 71 Z"
          fill="#FFB020" stroke="#FFB020" stroke-width="3" stroke-linejoin="round"/>
    <path d="M80 78 L100 84 Q102.5 85 100 87 L88 90 Q84 84 79 82 Z"
          fill="#E89100" stroke="#E89100" stroke-width="3" stroke-linejoin="round"/>

    <!-- eye, happily shut -->
    <path d="M60 66 C64 60 70 60 74 66" fill="none"
          stroke="#14202B" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- squawk lines -->
  <g stroke="#FFB020" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <path d="M110 42 L116 36"/>
    <path d="M113 60 H121"/>
    <path d="M110 78 L116 84"/>
  </g>
  </g>
</svg>
